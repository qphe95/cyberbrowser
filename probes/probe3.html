<!DOCTYPE html>
<html>
<head>
<style>
a{text-decoration:none;color:#0645ad;background:none}
a:visited{color:#6b4ba1}
@media print{
 table.floatright,div.floatright{border:0}
 a{background:none !important; padding:0 !important; }
 a,a.external,a.new,a.stub{color:inherit !important; text-decoration:inherit !important;}
}
</style>
</head>
<body>
<p style="font-size:20px">Plain text with <a href="/wiki/Foo">a standard link</a> and
<a href="/bar" class="external">an external link</a> here.</p>
</body>
</html>
