<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: sans-serif; margin: 8px; }
a { color: #3366cc; text-decoration: none; }
.box { width: 400px; border: 1px solid #999; padding: 4px; }
.fimg { float: left; width: 100px; height: 80px; background: #c00; margin: 0 8px 4px 0; }
</style>
</head>
<body>
<h1>Heading One</h1>
<p>Plain paragraph with <a href="/wiki/Foo">a blue link</a> inside it.</p>
<p><b>Bold text</b> and <i>italic text</i> and <u>underlined</u>.</p>
<ul>
<li>First bullet item</li>
<li>Second bullet item</li>
</ul>
<div class="box">
<div class="fimg"></div>
<p>Text that should wrap to the right of the red floated box, not overlap it.
More text more text more text more text more text more text more text.</p>
</div>
</body>
</html>
