\* Liveness, with the invariants again: two tab ids, two sites and an opaque
\* origin, up to two tab processes (an id reused once, or two tabs at once).
\* Checking temporal properties keeps the whole state graph, so this model is
\* smaller than Protocol.cfg's.
CONSTANTS
    Ids = {1, 2}
    Sites = {"a", "b", "opaque"}
    MaxStarts = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    BadgeTrue
    ClientsTrue
    OneClientPerId
    NoStaleClient
    SlotsTrue

PROPERTIES
    ClosedTabsEnd
    DeadChannelsRevoked
