\* Liveness, with the invariants again: two tab ids, two sites and an opaque
\* origin, up to two tab processes (an id reused once, or two tabs at once),
\* and a web-GPU process for site "a" (whose tabs, and opaque ones, ask for
\* one; "b"'s tabs live beside it and must never reach it).  Checking
\* temporal properties keeps the whole state graph, so this model is smaller
\* than Protocol.cfg's, and leaves out the tabs' requests to the servers
\* (Requests = FALSE): the liveness properties don't depend on them, and
\* Protocol.cfg checks what they do on the larger model.  Navigations that
\* end at another site are refused and the tab replaced (Redirects = TRUE):
\* the only model with them, so their invariant (DocTrue) and liveness
\* (RedirectsFollowed) are checked here, with two starts enough for a
\* replacement.
CONSTANTS
    Ids = {1, 2}
    Sites = {"a", "b", "opaque"}
    MaxStarts = 2
    MaxWStarts = 1
    WSites = {"a", "opaque"}
    Requests = FALSE
    Redirects = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    BadgeTrue
    ClientsTrue
    OneClientPerId
    NoStaleClient
    SlotsTrue
    WebgpuClientsTrue
    OneWebgpuPerSite
    DocTrue

PROPERTIES
    ClosedTabsEnd
    DeadChannelsRevoked
    WebgpuAnswered
    RedirectsFollowed
