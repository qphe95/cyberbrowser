\* Safety: two tab ids, two sites and an opaque origin, up to three tab
\* processes: enough to reuse an id across sites with requests and
\* revocations in flight.  (Liveness: ProtocolLive.cfg, on a smaller model.)
CONSTANTS
    Ids = {1, 2}
    Sites = {"a", "b", "opaque"}
    MaxStarts = 3

SPECIFICATION Spec

INVARIANTS
    TypeOK
    BadgeTrue
    ClientsTrue
    OneClientPerId
    NoStaleClient
    SlotsTrue
