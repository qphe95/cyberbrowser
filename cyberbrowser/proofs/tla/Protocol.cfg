\* Safety: two tab ids, two sites and an opaque origin, up to three tab
\* processes: enough to reuse an id across sites with requests and
\* revocations in flight.  No web-GPU processes here (WSites = {}): with
\* them this model is far too large; ProtocolLive.cfg checks them, and their
\* invariants, on a smaller model.  The ids are interchangeable (SYMMETRY).
CONSTANTS
    Ids = {i1, i2}
    Sites = {"a", "b", "opaque"}
    MaxStarts = 3
    MaxWStarts = 0
    WSites = {}
    Requests = TRUE

SPECIFICATION Spec
SYMMETRY IdSymmetry

INVARIANTS
    TypeOK
    BadgeTrue
    ClientsTrue
    OneClientPerId
    NoStaleClient
    SlotsTrue
    WebgpuClientsTrue
    OneWebgpuPerSite
