\* Safety: two tab ids, two sites and an opaque origin, up to three tab
\* processes: enough to reuse an id across sites with requests and
\* revocations in flight.  No web-GPU processes here (WSites = {}): with
\* them this model is far too large; ProtocolLive.cfg checks them, and their
\* invariants, on a smaller model.  The ids are interchangeable (SYMMETRY).
\* Navigations here end only at the tab's own site (Redirects = FALSE): with
\* refused ones the model has 3.7 times the states (24.2 million); like the
\* web-GPU processes, ProtocolLive.cfg checks them on the smaller model.
CONSTANTS
    Ids = {i1, i2}
    Sites = {"a", "b", "opaque"}
    MaxStarts = 3
    MaxWStarts = 0
    WSites = {}
    Requests = TRUE
    Redirects = FALSE

SPECIFICATION Spec
SYMMETRY IdSymmetry

INVARIANTS
    TypeOK
    BadgeTrue
    ClientsTrue
    OneClientPerId
    NoStaleClient
    SlotsTrue
    WebgpuClientsTrue
    OneWebgpuPerSite
    DocTrue
